name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 = Ubuntu 22.04 LTS (mínimo soportado) · 3.12 = 24.04 · 3.13 = actual
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint (errores reales, no estilo)
        run: pipx run ruff check src tests scripts/vaccine_tool.py --select F,E9
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  # Ataques reales en contenedores desechables, y lo que se instala de verdad. Solo donde importa:
  # tardan más que toda la suite.
  lab:
    needs: test
    if: github.ref_type == 'tag' || github.ref_name == 'f1-core-mvp' || startsWith(github.ref_name, 'feat/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Mini-lab (L1-L9, identidad, vacunas, propuestas)
        run: bash lab/docker-lab.sh
      - name: Lab systemd (servicio, ufw, reinicio, chat)
        run: bash lab/systemd-lab.sh

  build-package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Smoke test — CLI runs
        run: |
          python -m zipapp src -m "arx.cli:entry" -o arx.pyz
          python arx.pyz --version
          python arx.pyz status
          python arx.pyz license status
          python arx.pyz service status

      - name: Build .deb
        run: packaging/build-deb.sh

      - name: Install & verify on the runner (has systemd)
        run: |
          sudo dpkg -i dist/arx_all.deb || sudo apt-get install -f -y
          arx --version
          arx service status   # must not crash

      - name: Verify on Ubuntu 22.04 (python 3.10) and 24.04, without systemd
        run: |
          for img in ubuntu:22.04 ubuntu:24.04; do
            docker run --rm -v "$PWD":/src "$img" bash -c '
              apt-get update -qq && apt-get install -y -qq python3 >/dev/null
              cd /src && (dpkg -i dist/arx_all.deb || apt-get install -f -y)
              arx --version && arx service status && arx status'
          done

      - name: Checksums
        run: |
          cp arx.pyz dist/arx.pyz
          cd dist && sha256sum arx_all.deb arx.pyz > SHA256SUMS && cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arx-packages
          path: |
            dist/arx_all.deb
            dist/arx.pyz
            dist/SHA256SUMS

  release:
    # Solo al empujar un tag vX.Y.Z: publica lo que install.sh descarga y verifica.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # attestation de procedencia sin clave (Sigstore, OIDC de GitHub)
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arx-packages
          path: dist
      - name: Tag must match __version__
        run: |
          v="$(python3 -c "import sys; sys.path.insert(0,'src'); import arx; print(arx.__version__)")"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != versión v$v"; exit 1; }
      - name: Build provenance (verify with `gh attestation verify <file> -R mperez90/Arx`)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/arx_all.deb
            dist/arx.pyz
            dist/SHA256SUMS
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/arx_all.deb dist/arx.pyz dist/SHA256SUMS \
            --title "Arx $GITHUB_REF_NAME" --generate-notes
