[project]
name = "arx"
dynamic = ["version"]
description = "Arx — defensa activa y reactiva para servidores (Core)"
requires-python = ">=3.10"
license = { text = "BSL-1.1" }   # Core: Business Source License (no-reventa); ver README/LICENSE
authors = [{ name = "Arx" }]

dependencies = [
  # se fijan en F1 tras la auditoría de licencias:
  # osquery/auditd/falco se orquestan como servicios del sistema, no como deps python.
]

[project.scripts]
arx = "arx.cli:main"

[tool.hatch.version]
path = "src/arx/__init__.py"   # única fuente de la versión

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
